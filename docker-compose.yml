services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]

  # Runs once on first start to create all tables. Idempotent — safe to re-run.
  dynamodb-init:
    image: amazon/aws-cli:latest
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      - dynamodb-local
    restart: "no"
    entrypoint: ["/bin/sh", "/scripts/init-tables.sh"]
    volumes:
      - ./docker:/scripts:ro

