name: Analysis Eval

# Opt-in LLM evaluation of the transcript analysis. Hits Bedrock, so it never
# runs on PRs — only nightly and on manual dispatch. Scores prompt/model
# variants over the fixed fixtures and publishes a markdown report as an artifact.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC nightly
  workflow_dispatch:
    inputs:
      model_ids:
        description: "Comma-separated Bedrock model ids for the analysis matrix"
        required: false
        default: "amazon.nova-lite-v1:0"

jobs:
  eval:
    runs-on: ubuntu-latest
    environment: Test
    env:
      RUN_BEDROCK_EVAL: "1"
      EVAL_MODEL_IDS: ${{ github.event.inputs.model_ids || 'amazon.nova-lite-v1:0' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build eval project
        run: dotnet build tests/Analysis.Eval/Analysis.Eval.csproj

      - name: Run eval matrix (writes Results/*.jsonl)
        run: dotnet test tests/Analysis.Eval/Analysis.Eval.csproj --no-build --filter "Category!=Report"

      - name: Render report (Results/report.md)
        run: dotnet test tests/Analysis.Eval/Analysis.Eval.csproj --no-build --filter "Category=Report"

      - name: Upload eval results + report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: analysis-eval-results
          # Default (Debug) build output — keep in sync if the build/test steps gain -c Release.
          path: tests/Analysis.Eval/bin/Debug/net10.0/Results/
          if-no-files-found: warn
