name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CDK CLI
        run: npm install -g aws-cdk@2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Publish Lambda
        run: dotnet publish src/Api/Api.csproj -c Release -o
          src/Api/bin/Release/net8.0/publish

      - name: Deploy infrastructure
        run: cdk deploy --require-approval never --outputs-file outputs.json

      - name: Extract outputs
        id: outputs
        run: |
          echo "api-url=$(jq -r '.NoteTakerStack.ApiUrl' outputs.json)" >> $GITHUB_OUTPUT
          echo "frontend-url=$(jq -r '.NoteTakerStack.WebUrl' outputs.json)" >> $GITHUB_OUTPUT
          echo "bucket=$(jq -r '.NoteTakerStack.WebBucketName' outputs.json)" >> $GITHUB_OUTPUT
          echo "distribution-id=$(jq -r '.NoteTakerStack.DistributionId' outputs.json)" >> $GITHUB_OUTPUT

      - name: Print deployment URLs
        run: |
          echo "API URL:      ${{ steps.outputs.outputs.api-url }}"
          echo "Frontend URL: ${{ steps.outputs.outputs.frontend-url }}"

      - name: Build frontend
        working-directory: web
        run: npm ci && npm run build
        env:
          VITE_API_URL: ${{ steps.outputs.outputs.api-url }}

      - name: Verify API URL embedded in bundle
        run: |
          echo "VITE_API_URL was: ${{ steps.outputs.outputs.api-url }}"
          grep -o 'execute-api[^"]*' web/dist/assets/*.js | head -5 || echo "WARNING: no execute-api URL found in bundle"

      - name: Deploy frontend
        run: aws s3 sync web/dist/ s3://${{ steps.outputs.outputs.bucket }}/ --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{
          steps.outputs.outputs.distribution-id }} --paths "/*"

      - name: Warm up Lambda
        run: sleep 15

      - name: Acceptance specs
        run: dotnet test tests/Acceptance/Acceptance.csproj
        env:
          API_BASE_URL: ${{ steps.outputs.outputs.api-url }}
          FRONTEND_URL: ${{ steps.outputs.outputs.frontend-url }}
          DYNAMO_TIMEOUT_SECONDS: "3"

      - name: Debug CORS preflight
        run: |
          API_URL="${{ steps.outputs.outputs.api-url }}"
          ORIGIN="https://d1spb0hvpsbynd.cloudfront.net"
          echo "=== OPTIONS preflight ==="
          curl -v -X OPTIONS \
            -H "Origin: $ORIGIN" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type" \
            "${API_URL}/notes" 2>&1 || true
          echo "=== POST /notes ==="
          curl -v -X POST \
            -H "Origin: $ORIGIN" \
            -H "content-type: application/json" \
            -d 'null' \
            "${API_URL}/notes" 2>&1 || true

      - name: Build E2E project
        run: dotnet build tests/E2E/E2E.csproj -c Release

      - name: Install Playwright browsers
        run: pwsh tests/E2E/bin/Release/net8.0/playwright.ps1 install --with-deps
          chromium

      - name: E2E journey tests
        run: dotnet test tests/E2E/E2E.csproj -c Release
        env:
          FRONTEND_URL: ${{ steps.outputs.outputs.frontend-url }}

      - name: Clear test data
        if: always()
        run: |
          python3 << 'EOF'
          import boto3
          dynamodb = boto3.resource('dynamodb')
          for name in ['notetaker-events', 'notetaker-proj-notetitlelist']:
              table = dynamodb.Table(name)
              scan = table.scan()
              keys = {k['AttributeName'] for k in table.key_schema}
              with table.batch_writer() as batch:
                  for item in scan['Items']:
                      batch.delete_item(Key={k: v for k, v in item.items() if k in keys})
              print(f'Deleted {scan["Count"]} items from {name}')
          EOF

      - name: Upload Playwright trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: "**/trace.zip"
          if-no-files-found: ignore
