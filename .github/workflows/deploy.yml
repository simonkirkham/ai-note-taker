name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**" # all project documentation
      - "**/*.md" # README, CLAUDE.md, ADRs, learnings — anywhere in the tree
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - ".githooks/**" # local git hooks, never run in CI
      - ".claude/**" # agent skills/config, never built or deployed

jobs:
  validate-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Lint frontend
        working-directory: web
        run: npm run lint

      - name: Typecheck frontend
        working-directory: web
        run: npm exec -- tsc -p tsconfig.app.json --noEmit

      - name: Typecheck tests
        working-directory: web
        run: npm exec -- tsc -p tsconfig.test.json --noEmit

      - name: Test (component)
        working-directory: web
        run: npm run test

  validate-backend:
    runs-on: ubuntu-latest
    env:
      DYNAMO_TIMEOUT_SECONDS: "3"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build .NET solution
        run: dotnet build ai-note-taker.sln -p:TreatWarningsAsErrors=true --nologo -v quiet

      - name: Domain specs
        run: dotnet test tests/Domain.Specs/Domain.Specs.csproj --nologo -v quiet

      - name: API integration tests
        run: dotnet test tests/Api.Integration/Api.Integration.csproj --nologo -v quiet

      - name: Infra assertions
        run: dotnet test tests/Infrastructure.Assertions/Infrastructure.Assertions.csproj --nologo -v quiet

  deploy-test:
    needs: [validate-frontend, validate-backend]
    runs-on: ubuntu-latest
    environment:
      name: Test
      url: ${{ steps.outputs.outputs.frontend-url }}
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install CDK CLI
        run: npm install -g aws-cdk@2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Publish Lambda
        run: dotnet publish src/Api/Api.csproj -c Release -o
          src/Api/bin/Release/net10.0/publish

      - name: Deploy infrastructure
        run: cdk deploy --all --require-approval never --outputs-file outputs.json
        env:
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
          HOSTED_ZONE_ID: ${{ secrets.HOSTED_ZONE_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ALLOWED_USER_SUBS: ${{ secrets.ALLOWED_USER_SUBS }}
          GOOGLE_REFRESH_TOKEN_SSM_PATH: ${{ secrets.GOOGLE_REFRESH_TOKEN_SSM_PATH }}
          BEDROCK_MODEL_ID: ${{ secrets.BEDROCK_MODEL_ID }}

      - name: Extract outputs
        id: outputs
        run: |
          echo "api-url=$(jq -r '.NoteTakerStack.ApiUrl' outputs.json)" >> $GITHUB_OUTPUT
          echo "frontend-url=$(jq -r '.NoteTakerStack.WebUrl' outputs.json)" >> $GITHUB_OUTPUT
          echo "bucket=$(jq -r '.NoteTakerStack.WebBucketName' outputs.json)" >> $GITHUB_OUTPUT
          echo "distribution-id=$(jq -r '.NoteTakerStack.DistributionId' outputs.json)" >> $GITHUB_OUTPUT
          echo "rum-monitor-id=$(jq -r '.NoteTakerStack.RumMonitorId' outputs.json)" >> $GITHUB_OUTPUT
          echo "rum-identity-pool-id=$(jq -r '.NoteTakerStack.RumIdentityPoolId' outputs.json)" >> $GITHUB_OUTPUT

      - name: Print deployment URLs
        run: |
          echo "API URL:      ${{ steps.outputs.outputs.api-url }}"
          echo "Frontend URL: ${{ steps.outputs.outputs.frontend-url }}"

      - name: Build frontend
        working-directory: web
        run: npm ci && npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}

      - name: Inject RUM snippet
        working-directory: web
        env:
          RUM_MONITOR_ID: ${{ steps.outputs.outputs.rum-monitor-id }}
          RUM_IDENTITY_POOL_ID: ${{ steps.outputs.outputs.rum-identity-pool-id }}
          RUM_REGION: ${{ secrets.AWS_REGION }}
        run: |
          # GitHub passes unset secrets as "" and jq on a missing key returns "null";
          # refuse to ship an unmonitored frontend if either RUM output is absent.
          if [ -z "$RUM_MONITOR_ID" ] || [ "$RUM_MONITOR_ID" = "null" ] \
             || [ -z "$RUM_IDENTITY_POOL_ID" ] || [ "$RUM_IDENTITY_POOL_ID" = "null" ]; then
            echo "::error::RUM stack outputs missing — refusing to deploy frontend without monitoring"
            exit 1
          fi
          # Literal string-replace the empty placeholder in the BUILT artifact only
          # (dist/index.html), never the source web/index.html. Node avoids sed/regex
          # escaping pain with the snippet's slashes and braces.
          # NB: the cwr.js loader CDN is GLOBAL (us-east-1 only); only the data-plane
          # endpoint is regional. A client.rum.{region} loader host does not resolve.
          node -e '
            const fs = require("fs");
            const id = process.env.RUM_MONITOR_ID;
            const pool = process.env.RUM_IDENTITY_POOL_ID;
            const region = process.env.RUM_REGION;
            const snippet =
              `<script id="rum-snippet">(function(n,i,v,r,s,c,u,x,z){`
              + `x=window.AwsRumClient={q:[],n:n,i:i,v:v,r:r,c:c,u:u};`
              + `window[n]=function(c,p){x.q.push({c:c,p:p});};`
              + `z=document.createElement("script");z.async=true;z.src=s;`
              + `document.head.insertBefore(z,document.getElementsByTagName("script")[0]);`
              + `})("cwr","${id}","1.0.0","${region}",`
              + `"https://client.rum.us-east-1.amazonaws.com/3.x/cwr.js",`
              + `{sessionSampleRate:1,identityPoolId:"${pool}",`
              + `endpoint:"https://dataplane.rum.${region}.amazonaws.com",`
              + `telemetries:["errors","performance",["http",{addXRayTraceIdHeader:true}]],`
              + `allowCookies:true,enableXRay:true});</script>`;
            const file = "dist/index.html";
            const html = fs.readFileSync(file, "utf8");
            const placeholder = `<script id="rum-snippet"></script>`;
            if (!html.includes(placeholder)) {
              console.error("::error::rum-snippet placeholder not found in dist/index.html");
              process.exit(1);
            }
            fs.writeFileSync(file, html.replace(placeholder, snippet));
            console.log("Injected RUM snippet for monitor " + id);
          '

      - name: Deploy frontend
        run: aws s3 sync web/dist/ s3://${{ steps.outputs.outputs.bucket }}/ --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{
          steps.outputs.outputs.distribution-id }} --paths "/*"

      - name: Get smoke test token
        id: smoke-token
        env:
          REFRESH_TOKEN: ${{ secrets.SMOKE_TEST_GOOGLE_REFRESH_TOKEN }}
          CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "$REFRESH_TOKEN" ]; then
            echo "::warning::SMOKE_TEST_GOOGLE_REFRESH_TOKEN not configured — smoke tests requiring auth will be skipped."
            echo "id_token=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RESPONSE=$(curl -s -X POST "https://oauth2.googleapis.com/token" \
            -d "client_id=$CLIENT_ID" \
            -d "client_secret=$CLIENT_SECRET" \
            -d "refresh_token=$REFRESH_TOKEN" \
            -d "grant_type=refresh_token")
          ID_TOKEN=$(echo "$RESPONSE" | jq -r '.id_token // empty')
          if [ -z "$ID_TOKEN" ]; then
            ERROR=$(echo "$RESPONSE" | jq -r '.error // "unknown"')
            echo "::warning::Google token exchange failed (error: $ERROR) — smoke tests requiring auth will be skipped."
            echo "id_token=" >> "$GITHUB_OUTPUT"
          else
            echo "id_token=$ID_TOKEN" >> "$GITHUB_OUTPUT"
          fi

      - name: Acceptance specs
        run: dotnet test tests/Api.Smoke/Api.Smoke.csproj
        env:
          API_BASE_URL: ${{ steps.outputs.outputs.api-url }}
          FRONTEND_URL: ${{ steps.outputs.outputs.frontend-url }}
          DYNAMO_TIMEOUT_SECONDS: "3"
          SMOKE_TEST_TOKEN: ${{ steps.smoke-token.outputs.id_token }}

      - name: Build E2E project
        run: dotnet build tests/Browser.E2E/Browser.E2E.csproj -c Release

      - name: Install Playwright browsers
        run: pwsh tests/Browser.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Clear test data (pre-E2E)
        uses: ./.github/actions/clear-test-data

      - name: E2E journey tests
        run: dotnet test tests/Browser.E2E/Browser.E2E.csproj -c Release
        env:
          FRONTEND_URL: ${{ steps.outputs.outputs.frontend-url }}
          API_URL: ${{ steps.outputs.outputs.api-url }}
          E2E_GOOGLE_ID_TOKEN: ${{ steps.smoke-token.outputs.id_token }}

      - name: Clear test data
        if: always()
        uses: ./.github/actions/clear-test-data

      - name: Upload Playwright trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: "**/trace.zip"
          if-no-files-found: ignore

  deploy-production:
    needs: deploy-test
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ steps.outputs.outputs.frontend-url }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install CDK CLI
        run: npm install -g aws-cdk@2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Publish Lambda
        run: dotnet publish src/Api/Api.csproj -c Release -o
          src/Api/bin/Release/net10.0/publish

      - name: Deploy infrastructure
        run: cdk deploy --all --require-approval never --outputs-file outputs.json
