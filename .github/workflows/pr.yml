name: PR Checks

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "docs/**" # all project documentation
      - "**/*.md" # README, CLAUDE.md, ADRs, learnings — anywhere in the tree
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - ".claude/**" # agent skills/config, never built or deployed
      - "scripts/**" # dev/ops scripts, never built or deployed

# Cancel an in-flight PR run when a newer commit is pushed to the same PR — only
# the latest commit's checks matter, so superseded runs are wasted runner time.
# Keyed per-PR (head branch); does NOT affect main/deploy (a different workflow).
concurrency:
  group: pr-checks-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DYNAMO_TIMEOUT_SECONDS: "3"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install CDK CLI
        run: npm install -g aws-cdk@2

      - name: Build (0 warnings)
        run: dotnet build ai-note-taker.sln -p:TreatWarningsAsErrors=true

      - name: Test (domain specs)
        run: dotnet test tests/Domain.Specs/Domain.Specs.csproj

      - name: Test (API integration)
        run: dotnet test tests/Api.Integration/Api.Integration.csproj

      - name: Test (infra assertions)
        run: dotnet test tests/Infrastructure.Assertions/Infrastructure.Assertions.csproj

      - name: Publish Lambda
        # -r linux-x64 --self-contained false enables ReadyToRun (TI-35); see deploy.yml.
        run: dotnet publish src/Api/Api.csproj -c Release -r linux-x64 --self-contained false -o src/Api/bin/Release/net10.0/publish

      # 27-B: the Projector Lambda is a second CDK asset; its publish dir must hold a
      # real build before `cdk synth` validates the Code.FromAsset path.
      - name: Publish Projector Lambda
        run: dotnet publish src/Projector/Projector.csproj -c Release -o src/Projector/bin/Release/net10.0/publish

      # 33-B1: the batch-diarization completion Lambda is a third CDK asset; its publish
      # dir must hold a real build before `cdk synth` validates the Code.FromAsset path.
      - name: Publish TranscribeCompletion Lambda
        run: dotnet publish src/TranscribeCompletion/TranscribeCompletion.csproj -c Release -o src/TranscribeCompletion/bin/Release/net10.0/publish

      # No AWS credentials needed: the CDK app does no context lookups
      # (no FromLookup / ValueFromLookup). If a future change adds one,
      # restore the configure-aws-credentials step + environment: Test.
      - name: CDK Synth
        run: cdk synth

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Typecheck
        working-directory: web
        run: npm exec -- tsc -p tsconfig.app.json --noEmit

      - name: Typecheck (tests)
        working-directory: web
        run: npm exec -- tsc -p tsconfig.test.json --noEmit

      - name: Test (component)
        working-directory: web
        run: npm run test

      - name: Build
        working-directory: web
        run: npm run build

      - name: Bundle size budget
        working-directory: web
        run: npm run size

  # TI-71: this is the only job that pulls container images, and every registry it can reach
  # rate-limits anonymous pulls from a GitHub runner's shared egress IPs. Testcontainers
  # surfaces a throttled pull as a per-test failure at fixture start, so one registry hiccup
  # is reported as dozens of independent test failures on a diff containing no C# at all.
  # Three things below leave no anonymous pull in the test phase: the image comes from AWS's
  # ECR Public copy rather than Docker Hub, it is pulled once up front instead of once per
  # test class, and Testcontainers' Ryuk reaper (a second Docker Hub image) is disabled.
  eventstore:
    runs-on: ubuntu-latest
    env:
      DYNAMO_TIMEOUT_SECONDS: "3"
      # Read by DynamoDbLocalImage.Reference, so the pre-pull step below and the tests cannot
      # name different images. Its default lives in DynamoDbLocalImage.cs for local runs.
      DYNAMODB_LOCAL_IMAGE: "public.ecr.aws/aws-dynamodb-local/aws-dynamodb-local:1.21.0"
      # Ryuk is testcontainers/ryuk on Docker Hub, started automatically to reap containers
      # a crashed test run leaks. It has no ECR Public mirror, and it earns nothing on an
      # ephemeral runner that is destroyed after the job — the fixtures dispose their own
      # containers. Left enabled locally, where leaked containers do outlive the run.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # Every test class here owns its own container and xUnit runs classes in parallel, so
      # without this each one issues its own pull of the same image at the same moment. ECR
      # Public allows one anonymous pull per second per IP, so that burst is throttled even
      # though the registry is perfectly healthy — observed on this PR's first run as
      # "toomanyrequests: Rate exceeded", 5 failed / 32 passed. One sequential pull leaves
      # Testcontainers nothing to fetch (its default pull policy is missing-only), and moves
      # the remaining failure mode to a single retried step whose error says what went wrong.
      - name: Pre-pull DynamoDB Local image
        run: |
          for attempt in 1 2 3 4 5; do
            if docker pull "$DYNAMODB_LOCAL_IMAGE"; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              break
            fi
            echo "pull attempt $attempt failed; retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          echo "::error::could not pull $DYNAMODB_LOCAL_IMAGE after 5 attempts"
          exit 1

      - name: Test (EventStore integration)
        run: dotnet test tests/EventStore.Integration/EventStore.Integration.csproj

  # BUG-56: until now NOTHING ran desktop/tests/ — publish-desktop.yml packages the installer but
  # runs no tests, and pr.yml had no desktop job at all. So the whole Electron shell shipped on
  # local runs only, and BUG-52/53/56 all reached a user's machine. The specs that catch them are
  # pure and headless; there is no reason they were not gated.
  #
  # Runs on ubuntu, not windows-latest: every spec here is either pure logic, config assertions, or
  # Electron-under-xvfb, none of which need Windows. Proving the REAL whisper binaries (Windows-only
  # by Phase 31 scope) needs a windows-latest job — filed separately in technical-improvements.md,
  # deliberately not bundled here so this stays cheap enough to gate every PR.
  desktop:
    runs-on: ubuntu-latest
    # The one job here that launches a GUI process. Bounded in practice by playwright.config.ts's
    # per-test timeout, but the 44-minute E2E hang (see the CLAUDE.md guardrail) is why a stuck
    # process must never be able to hold a runner open indefinitely. The job takes ~1 min.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          # Both lockfiles: this job installs web/ as well, so caching only desktop's would
          # leave the larger of the two installs uncached.
          cache-dependency-path: |
            desktop/package-lock.json
            web/package-lock.json

      # web/ is a real dependency: `npm run build` stages the compiled frontend into
      # desktop/web-dist, which server.spec.ts and shell.e2e.ts serve and assert against.
      # Verified locally: server.spec.ts fails without this build and passes with it.
      - name: Install dependencies
        run: |
          npm --prefix web ci
          npm --prefix desktop ci

      - name: Build (frontend bundle + Electron main)
        run: npm --prefix desktop run build

      # xvfb: shell.e2e.ts launches the real Electron app, which needs a display even headless.
      # The whisper specs that need real binaries self-skip when their env vars are unset.
      - name: Test (desktop)
        run: xvfb-run --auto-servernum npm --prefix desktop run test:e2e
