name: PR Checks

on:
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    environment: Test
    env:
      DYNAMO_TIMEOUT_SECONDS: "3"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CDK CLI
        run: npm install -g aws-cdk@2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build (0 warnings)
        run: dotnet build ai-note-taker.sln -p:TreatWarningsAsErrors=true

      - name: Test (domain specs)
        run: dotnet test tests/Domain.Specs/Domain.Specs.csproj

      - name: Test (API integration)
        run: dotnet test tests/Api.Integration/Api.Integration.csproj

      - name: Test (infra assertions)
        run: dotnet test tests/Infrastructure.Assertions/Infrastructure.Assertions.csproj

      - name: Publish Lambda
        run: dotnet publish src/Api/Api.csproj -c Release -o src/Api/bin/Release/net10.0/publish

      - name: CDK Synth
        run: cdk synth

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Typecheck
        working-directory: web
        run: npm exec -- tsc -p tsconfig.app.json --noEmit

      - name: Typecheck (tests)
        working-directory: web
        run: npm exec -- tsc -p tsconfig.test.json --noEmit

      - name: Test (component)
        working-directory: web
        run: npm run test

      - name: Build
        working-directory: web
        run: npm run build

  eventstore:
    runs-on: ubuntu-latest
    env:
      DYNAMO_TIMEOUT_SECONDS: "3"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test (EventStore integration)
        run: dotnet test tests/EventStore.Integration/EventStore.Integration.csproj
