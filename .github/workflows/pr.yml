name: PR Checks

on:
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    environment: Test
    env:
      DYNAMO_TIMEOUT_SECONDS: "3"
    steps:
      - name: Verify main is in a known good state
        run: |
          CONCLUSION=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --branch main \
            --workflow deploy.yml \
            --status completed \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion // "no-deploy-found"')
          echo "Last deploy conclusion on main: $CONCLUSION"
          if [ "$CONCLUSION" != "success" ]; then
            echo "ERROR: main's last deploy is not green ($CONCLUSION). Fix main before merging."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CDK CLI
        run: npm install -g aws-cdk@2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build (0 warnings)
        run: dotnet build ai-note-taker.sln -p:TreatWarningsAsErrors=true

      - name: Test (domain specs)
        run: dotnet test tests/Domain.Specs/Domain.Specs.csproj

      - name: Test (EventStore integration)
        run: dotnet test tests/EventStore.Integration/EventStore.Integration.csproj

      - name: Test (API integration)
        run: dotnet test tests/Api.Integration/Api.Integration.csproj

      - name: Test (infra assertions)
        run: dotnet test tests/Infrastructure.Assertions/Infrastructure.Assertions.csproj

      - name: Publish Lambda
        run: dotnet publish src/Api/Api.csproj -c Release -o
          src/Api/bin/Release/net10.0/publish

      - name: CDK Synth
        run: cdk synth

      - name: Lint frontend
        working-directory: web
        run: npm ci && npm run lint

      - name: Frontend build
        working-directory: web
        run: npm run build
