name: Publish Desktop Installer

# Build the Windows installer and publish it to GitHub Releases AFTER a successful prod
# deploy, so the desktop app updates by *pulling* the artifact (`npm run update`) — no local
# rebuild. Separate from the Deploy workflow: it runs after Deploy and never gates or slows
# it (deploy-time impact: neutral). Only (re)builds when the frontend or desktop changed, so
# backend/docs-only deploys don't burn a Windows runner.

on:
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write # publish a Release

# No concurrency group on purpose (53-A review): a group cancels a queued run when a newer one
# arrives, and a cancelled web-change publish would never be built. Two overlapping publishes can
# instead lose one update-history entry, which only makes the app under-count by one.

jobs:
  publish:
    # Only after a green Deploy (so the artifact == a version that actually went live), or manual.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Did the frontend or desktop change?
        id: changed
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # Manual runs always build; auto runs build only when the frontend/desktop changed
          # (a backend/docs-only deploy leaves the installer unchanged — don't burn a runner).
          if [ "$EVENT" = "workflow_dispatch" ] || git diff --name-only HEAD~1 HEAD | grep -qE '^(web/|desktop/)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No web/ or desktop/ change — the installer is unchanged; skipping build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v6
        if: steps.changed.outputs.build == 'true'
        with:
          node-version: "24"

      - name: Install dependencies
        if: steps.changed.outputs.build == 'true'
        run: |
          npm --prefix web ci
          npm --prefix desktop ci

      - name: Version the build (base 1.0.0 + date.run, per build)
        if: steps.changed.outputs.build == 'true'
        shell: bash
        run: |
          # Each rolling build gets a unique, informative version in the .exe filename: base 1.0.0
          # + build date + this workflow's run number, e.g. 1.0.0-20260724.118 →
          # AINoteTaker-Setup-1.0.0-20260724.118-x64.exe. Valid semver (a prerelease of 1.0.0);
          # 54-A: precedence now MATTERS — the installed app updates only to a strictly greater version
          # (semver: numeric prerelease parts compare as numbers), so keep date.run increasing.
          # --no-git-tag-version edits package.json only — no commit/tag; never committed to the repo.
          VER="1.0.0-$(date +%Y%m%d).${{ github.run_number }}"
          npm --prefix desktop version --no-git-tag-version --allow-same-version "$VER"
          echo "Building desktop installer version $VER"
          # 53-A: one timestamp, baked into the app AND written to the update history, so the
          # app can count the published updates built after itself.
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "INSTALLER_VERSION=$VER" >> "$GITHUB_ENV"

      - name: Build the Windows installer
        if: steps.changed.outputs.build == 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # unsigned build — do not attempt code signing
          # CHANGE-41: the build stamp at the foot of the sidebar. This installer is built from
          # the deploy that just went green, so it carries THAT deploy's number — desktop and
          # web then report the same build. Empty on a manual dispatch (no deploy behind it),
          # where the app falls back to "Build dev". build-web.mjs passes the env through.
          VITE_BUILD_NUMBER: ${{ github.event.workflow_run.run_number }}
          VITE_BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          # 53-A: the update notice compares this against the published update history.
          VITE_BUILD_TIME: ${{ env.BUILD_TIME }}
          # CHANGE-43: the DEPLOY's run, matching the release number the app already shows, plus
          # the installer version from the filename — both readable by hovering the stamp.
          VITE_BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
          VITE_BUILD_INSTALLER_VERSION: ${{ env.INSTALLER_VERSION }}
          # TI-98: build-web.mjs copies the monitoring snippet from the live site, which this
          # run follows. Fail rather than publish an installer whose faults reach nothing.
          REQUIRE_RUM_SNIPPET: "1"
        run: npm --prefix desktop run package

      - name: Publish to GitHub Releases (rolling 'desktop-latest')
        if: steps.changed.outputs.build == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(git rev-parse --short HEAD)
          # 53-A: carry the update history forward before the old release is deleted. A first
          # run (or a release without one) starts a fresh history.
          mkdir -p history
          gh release download desktop-latest --pattern releases.json --dir history --clobber || echo "No previous update history — starting one."
          node desktop/scripts/append-history.mjs history/releases.json releases.json "$(git rev-parse HEAD)" "$BUILD_TIME"
          # Never delete the release people update from unless its replacement history exists.
          test -s releases.json
          # 54-A: nor without the manifest installed apps update from — a publish missing it would
          # silently stop every copy updating itself.
          test -s desktop/release/latest.yml
          ls desktop/release/*.blockmap
          gh release delete desktop-latest --yes --cleanup-tag || true
          # Upload build-sha.txt (the bundled commit marker) alongside the .exe so
          # `npm run update` can version-check by pulling a tiny file, not the 82 MB installer.
          # 53-A: releases.json feeds the in-app update notice; update.ps1 is what its copied
          # command downloads and runs, so it works with no checkout.
          # 54-A: latest.yml is what the installed app checks to update itself; the .blockmap lets
          # it download only the changed parts if an older installer is ever still published.
          gh release create desktop-latest desktop/release/*.exe desktop/release/latest.yml desktop/release/*.blockmap desktop/web-dist/build-sha.txt releases.json desktop/scripts/update.ps1 \
            --title "AI Note Taker desktop ($SHA)" \
            --notes "Unsigned Windows installer built from $SHA (latest successful prod deploy). Update with \`npm run update\`. SmartScreen may warn on first run."
