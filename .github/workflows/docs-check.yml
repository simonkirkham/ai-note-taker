name: Repo Checks

# Cheap guards over the parts of the repo that pr.yml cannot see, or does not check.
#
# Why this exists as its own workflow: pr.yml `paths-ignore`s docs/**, **/*.md and
# scripts/**, so a docs-only PR runs NO checks at all. The tracking-doc id check used
# to live in a pre-commit hook that each clone had to opt into with
# `git config core.hooksPath .githooks` — and at least one clone had it pointed
# elsewhere, so the check had never run there. A guard that depends on per-machine
# setup protects nobody by default; this runs for every clone and every session.
# The hook was removed entirely on 2026-08-11, so this is now the ONLY enforcement
# point for both checks below.
#
# The workflow lint (TI-70) is here for a different reason. pr.yml DOES trigger on a
# workflow-only change — .github/** is not paths-ignored — but every check it runs is a
# build or a test, and none of them so much as parses a workflow file. That is how
# TI-69 shipped: `timeout-minutes: ${{ fromJSON(inputs.runs) * 4 + 15 }}` is a PARSE
# error, so e2e.yml never loaded, `on:` was never read, `workflow_dispatch` was never
# registered, and 162 pushes over three days each got a zero-job red run named by file
# path with no failing check and no annotation anywhere. Its PR was green.
#
# The merge-gate self-test (TI-77) is here for the third variant of the same reason:
# pr.yml paths-ignores scripts/**, so every past edit to the merge gate shipped
# unexercised.
#
# The `push:` trigger (TI-80) closes the other half of all three. A pull request is not
# the only way into `main`: CLAUDE.md routes doc edits straight there, and every one of
# the paths below is reachable by a direct commit. Until this trigger existed, a workflow
# file pushed to `main` was linted by nothing anywhere — `.githooks/pre-commit` had been
# the last (opt-in, per-clone) defence and it was deleted on 2026-08-11. That is the exact
# route TI-69 shipped through. It carried a copy of the `paths:` list until TI-83 deleted
# it; see the comment on the trigger for why subtraction beat keeping the two in step.
#
# Deliberately narrow: it does not build, test, or deploy anything. Grep + a stubbed
# shell test + one Go binary, well under a minute. On a pull request both jobs run whenever
# any listed path changes — a docs-only PR also pays ~6s of actionlint and a workflow-only
# PR also pays the grep and the self-test, which is cheaper than the machinery needed to
# scope each job to its own paths. On a push to `main` both simply always run.

on:
  pull_request:
    branches: [ main ]
    paths:
      - "docs/phases/phase-bugs.md"
      # check-doc-ids.sh reads the archive for two of its checks (duplicate "## BUG-N"
      # entries, and a bug living in both the live doc and the archive), so a PR that
      # touches only the archive must still run it. Added by TI-83; it had been missing
      # from both lists since the archive was created.
      - "docs/phases/phase-bugs-archive.md"
      - "docs/phases/phase-minor-changes.md"
      - "docs/technical-improvements.md"
      - "docs/roadmap.md"
      # One entry covering every shell script, replacing five that were listed by name
      # (check-doc-ids, merge-gate, deploy-status, test-merge-gate, lint-workflows). All five
      # live under scripts/, so all five are inside this glob — this is a net deletion, not an
      # addition. TI-79's guard reads EVERY tracked shell script, so listing only its own two
      # files would leave a bad wait loop added to any other script ungated.
      #
      # "**/*.sh" reaches the repo ROOT, where dev.sh lives. Measured rather than derived:
      # deploy.yml paths-ignores "**/*.md", and three commits on main touching only the
      # root-level CLAUDE.md produced no deploy.yml run — so GitHub's "**/" matches zero path
      # segments. The only .sh files outside scripts/ are dev.sh and docker/init-tables.sh.
      - "**/*.sh"
      # TI-70's workflow lint (PR #464). ".github/workflows/**" subsumes the explicit
      # docs-check.yml entry below it; both kept so neither side of the merge lost a line.
      - ".github/workflows/docs-check.yml"
      - ".github/workflows/**"
      # Metadata only — actionlint validates a local action's YAML and `runs.using` via the
      # workflow that `uses:` it, but NOT the shell inside its own `run:` block. Listed anyway
      # so the metadata check runs when one changes. See scripts/lint-workflows.sh's header.
      - ".github/actions/**"

  # NO `paths:` here, deliberately (TI-83). Both jobs read the WHOLE tree whatever a commit
  # touched — actionlint lints every workflow, check-doc-ids.sh greps every tracking doc —
  # so the list never scoped what got CHECKED. It only decided whether the check RAN, which
  # made it pure drift surface: GitHub Actions has no YAML anchors, so keeping it meant
  # typing the same list twice and hoping the copies stayed in step. And drift on THIS side
  # is the silent one — a path missing from the pull_request list makes a check visibly stop
  # appearing on PRs, while a path missing here just quietly stops guarding the route that
  # has no other guard.
  #
  # It had already drifted: `docs/phases/phase-bugs-archive.md` is read by check-doc-ids.sh
  # for two of its checks (duplicate `## BUG-N` entries, and a bug living in both the live
  # doc and the archive) and was in NEITHER list. So an archive-ONLY commit matches neither
  # trigger and runs no check at all — and archive-only is exactly the shape of a half-done
  # close, where the row was never deleted from phase-bugs.md, which is the case the
  # duplicate check exists to catch. Archiving is a Scribe step that commits straight to
  # `main`, the one route with no other guard.
  #
  # LATENT, NOT OBSERVED — the record should not imply this has already bitten. All 11
  # commits that have ever touched the archive on `main` also touched phase-bugs.md, so
  # every one of them matched; and the push trigger did not exist at all until 14c6c034
  # (2026-08-12, TI-80), which is after the most recent of them (bb4c5611, 2026-08-11).
  # Demonstrated deliberately instead, on `proof/ti83-paths`: commit 1cf9468d changed only
  # the archive and added a duplicate `## BUG-1`, and produced NO run at all — that
  # branch's only run is 31623178252, on its parent 8589d591. The branch has since been
  # deleted, so that sha no longer resolves; run 31623178252 is the durable record.
  #
  # Subtracting the list closes that here without anyone having to remember it, and closes
  # every future instance of it too; the pull_request list gets the path added by hand,
  # because there the filter is still worth having.
  #
  # LIMIT, so nobody reads this as more than it is: dropping `paths:` makes the workflow run
  # whenever a push EVENT arrives. It does nothing when no push event arrives at all — a
  # commit on `main` that triggers no check-suites in the first place is a separate defect
  # and is tracked separately (TI-90).
  #
  # The cost, stated because deploy time is a first-class cost here: both jobs now run on
  # EVERY push to `main` rather than on a matching one. Deploy wall clock is UNCHANGED —
  # these jobs do not gate deploy.yml and run in parallel with it, so no merge waits any
  # longer. Per-JOB duration over the last twelve push runs (2026-08-13): doc-ids 19-23s,
  # workflows 5-10s, the two in parallel. The recurring bill is ZERO: this repo is public,
  # so standard-runner minutes are free.
  #
  # The one real cost was that each extra run is another actionlint download, and
  # lint-workflows.sh used to fetch it with no --retry and no cache — so a network blip
  # red-X'd a `main` commit that did nothing wrong, and more runs meant more of that.
  # TI-84 (PR #474, merged 608c882e on 2026-08-13) added the retry and landed first; this
  # change is rebased onto it. Resolved, not accepted.
  push:
    branches: [ main ]

# Keyed by head branch on a pull request, so a newer commit cancels the superseded run —
# only the latest commit's checks matter there.
#
# On a push there is no head_ref, and keying by `github.ref` would put every push to
# `main` in ONE group with cancel-in-progress — so a second merge landing a minute after
# the first would CANCEL the first's lint, and a cancelled run is not a failing run. The
# broken workflow would reach `main` unlinted, which is precisely TI-80's hole reopened.
# Merges land minutes apart here routinely. Keying by `github.sha` gives each pushed
# commit its own group: no push can cancel another, and every commit that reaches `main`
# is linted exactly once.
concurrency:
  group: docs-check-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  doc-ids:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      # Catches two things:
      #  - two rows sharing an id, i.e. the one bad outcome of the `merge=union` driver
      #    on these tables (two branches editing the SAME row keeps both copies)
      #  - docs/roadmap.md re-growing its own copy of bug status, which is what made it
      #    both stale and the most-conflicted line in the repo
      - name: Tracking-doc ids
        # Invoked via `bash` deliberately: this repo lives on a Windows/WSL mount where the
        # executable bit does not survive, so most of scripts/ is committed 100644. The bit is
        # set on this script too, but `bash` means a future script losing it cannot break the gate.
        run: bash ./scripts/check-doc-ids.sh

      # The merge gate and the deploy-status check are reachable by no other workflow:
      # pr.yml paths-ignores scripts/**, so every past edit to them shipped unexercised —
      # which is how TI-77 (uncomputed mergeability reported as a conflict, sending you to
      # rebase a clean branch) survived. Stub-driven, deterministic, no network, ~15s.
      - name: Merge-gate self-test
        run: bash ./scripts/test-merge-gate.sh

      # TI-79. A wait built on scanning process command lines for a literal SELF-MATCHES: each
      # Bash tool call runs as `/bin/bash -c … && eval '<the entire command text>'`, so the
      # wrapper's own cmdline carries the pattern and the scan always finds itself. The loop
      # reported from 2026-08-11 — `until ! pgrep -f "bin/eslint"; do sleep 15; done` — could
      # never have exited, and a stuck session cannot be reached by message either, so nobody
      # is told. This refuses the SHAPE (a loop waiting on a cmdline scan, by any means), not
      # the tool: a one-shot `pgrep -f` in a bare-path script is correct and stays green. Same
      # reason as the two checks above — pr.yml paths-ignores scripts/**, and .githooks/ was
      # deleted on 2026-08-11, so this is the only place the check can run.
      - name: Cmdline-scan wait loops
        run: bash ./scripts/check-cmdline-waits.sh

      # The guard's own self-test: 27 fixtures — 17 that must go RED and 10 that must stay
      # GREEN — plus a repo-wide scan. It is the injected-defect check made permanent; without
      # it, a guard that had quietly stopped biting would look exactly like a clean repo, which
      # is not a hypothetical here. Seven dangerous loops passed the first draft, including
      # `ps aux`, and they are now seven of those fixtures.
      - name: Cmdline-scan guard self-test
        run: bash ./scripts/test-check-cmdline-waits.sh

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      # actionlint parses every workflow, checks each ${{ }} against the real expression
      # grammar and the contexts available at that key, rejects unknown keys, and pipes
      # each `run:` block through shellcheck. Run the same script locally for early
      # feedback; there is one definition of "a valid workflow", not two that can drift.
      #
      # LINT_WORKFLOWS_REQUIRE_SHELLCHECK: ubuntu-latest ships shellcheck, but actionlint
      # drops those rules SILENTLY if it is ever absent, leaving a green run at half
      # coverage. Fail loudly instead of shrinking quietly.
      - name: Workflow lint (actionlint)
        env:
          LINT_WORKFLOWS_REQUIRE_SHELLCHECK: "1"
        run: bash ./scripts/lint-workflows.sh
