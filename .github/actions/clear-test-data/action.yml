name: Clear test data
description: Delete all items from the DynamoDB test tables
runs:
  using: composite
  steps:
    - name: Clear DynamoDB test tables
      shell: bash
      # The table list and delete logic live in scripts/clear-test-data.py so the
      # deploy gate and the on-demand E2E re-runner (.github/workflows/e2e.yml)
      # cannot drift apart — a projection table added to one copy but not the other
      # leaks stale read-model rows across runs.
      run: python3 "$GITHUB_WORKSPACE/scripts/clear-test-data.py"
